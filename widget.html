<!doctype html>
<html><head><meta charset="utf-8"><title>Toast Docs widget</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px 'Segoe UI', system-ui, sans-serif; color: #e6e5e1; user-select: none; }
  #box { position: absolute; inset: 4px; border-radius: 18px; background: rgba(28, 29, 32, .86); border: 1.5px dashed rgba(160, 159, 155, .45);
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 10px; box-sizing: border-box;
         transition: background .12s, border-color .12s; cursor: default; }
  #box.over { background: rgba(110, 164, 238, .30); border-color: #6ea4ee; border-style: solid; }
  #box.busy { border-style: solid; border-color: rgba(110, 164, 238, .6); }
  .logo { width: 40%; max-width: 76px; aspect-ratio: 1; display: block; transition: transform .15s; }
  #box.over .logo { transform: scale(1.12) rotate(-6deg); }   /* the bear perks up when files come over it */
  #box.over .bear-eye { transform: scaleY(1.25); }
  .bear-eye { transform-box: fill-box; transform-origin: center; }
  .title { font-weight: 600; }
  .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .acts span { font-size: 10.5px; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,.08); color: #c9c8c4; }
  #status { font-size: 12px; color: #a09f9b; min-height: 16px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  #status.done { color: #8fd18f; cursor: pointer; text-decoration: underline; }
  #status.err { color: #f0a0a0; }
  #cancel { display: none; margin-top: 2px; padding: 3px 12px; border-radius: 99px; border: 0; background: #e05656; color: #fff; font: inherit; font-size: 12px; cursor: pointer; }
  #grip { position: absolute; right: 6px; bottom: 6px; width: 14px; height: 14px; cursor: nwse-resize; opacity: .5;
          background: linear-gradient(135deg, transparent 50%, #a09f9b 50%, transparent 62%, transparent 70%, #a09f9b 70%, transparent 82%); }
  body.small .acts, body.small .title { display: none; }
  #close { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border: 0; border-radius: 50%; padding: 0;
           background: rgba(255,255,255,.08); color: #c9c8c4; font: 15px/22px 'Segoe UI', sans-serif; cursor: pointer; opacity: 0; transition: opacity .15s, background .12s; }
  body:hover #close { opacity: 1; }
  #close:hover { background: #e05656; color: #fff; }
</style></head>
<body>
<div id="box">
  <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
    <!-- a little bear holding a page -->
    <circle cx="24" cy="24" r="13" fill="#b8763e"/><circle cx="24" cy="24" r="7" fill="#e9b98a"/>
    <circle cx="76" cy="24" r="13" fill="#b8763e"/><circle cx="76" cy="24" r="7" fill="#e9b98a"/>
    <ellipse cx="50" cy="52" rx="36" ry="33" fill="#c8864a"/>
    <ellipse cx="50" cy="63" rx="17" ry="13" fill="#f1d2ac"/>
    <ellipse class="bear-eye" cx="37" cy="48" rx="4" ry="4.6" fill="#2b1a0e"/><circle cx="38.4" cy="46.4" r="1.4" fill="#fff"/>
    <ellipse class="bear-eye" cx="63" cy="48" rx="4" ry="4.6" fill="#2b1a0e"/><circle cx="64.4" cy="46.4" r="1.4" fill="#fff"/>
    <ellipse cx="50" cy="58" rx="5.5" ry="4" fill="#2b1a0e"/>
    <path d="M44.5 65 Q50 70 55.5 65" fill="none" stroke="#2b1a0e" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="27" cy="60" rx="6" ry="3.6" fill="#f08f8f" opacity=".55"/><ellipse cx="73" cy="60" rx="6" ry="3.6" fill="#f08f8f" opacity=".55"/>
    <g transform="rotate(-8 50 88)">
      <rect x="36" y="76" width="28" height="22" rx="2.5" fill="#fff" stroke="#d9d6cf" stroke-width="1"/>
      <rect x="40" y="81" width="20" height="2.4" rx="1" fill="#e8a33d"/><rect x="40" y="86" width="16" height="2" rx="1" fill="#c9c8c4"/><rect x="40" y="90" width="18" height="2" rx="1" fill="#c9c8c4"/>
      <ellipse cx="35" cy="86" rx="6" ry="5" fill="#b8763e"/><ellipse cx="65" cy="86" rx="6" ry="5" fill="#b8763e"/>
    </g>
  </svg>
  <div class="title">Drop files here</div>
  <div class="acts"></div>
  <div id="status"></div>
  <button id="cancel">Cancel</button>
</div>
<div id="grip" title="Drag to resize"></div>
<button id="close" title="Close the widget (Settings > Desktop widget brings it back)">×</button>
<script>
const { ipcRenderer, webUtils } = require('electron');
const fs = require('fs'), path = require('path');
const $ = id => document.getElementById(id);
let S = null, busy = false, lastOut = null;
const NAMES = { convert: 'Convert', merge: 'Merge', split: 'Split', print: 'Print', open: 'Open' };

async function load() { S = await ipcRenderer.invoke('widget-settings-get'); paint(); }
ipcRenderer.on('widget-settings', (_e, s) => { S = s; paint(); });
function paint() {
  const on = Object.keys(NAMES).filter(k => S.actions[k]);
  document.querySelector('.acts').innerHTML = on.map(k => `<span>${NAMES[k]}${k === 'print' && S.printer ? ': ' + esc(S.printer.split('\\').pop()) : ''}</span>`).join('') || '<span>Nothing picked: right-click</span>';
  document.body.classList.toggle('small', innerWidth < 170);
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const status = (t, kind = '') => { const el = $('status'); el.textContent = t; el.className = kind; };
addEventListener('resize', paint);
let noteTimer = null;
ipcRenderer.on('widget-note', (_e, t) => {
  if (busy) return;
  status(t); clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { if (!busy && $('status').textContent === t) status(''); }, 2000);
});

// ---------- moving and resizing (the window has no frame) ----------
$('box').addEventListener('mousedown', async e => {
  if (e.button !== 0 || e.target.closest('#status.done, #cancel')) return;
  const b = await ipcRenderer.invoke('widget-bounds'); if (!b) return;
  const x0 = e.screenX, y0 = e.screenY;
  const move = ev => ipcRenderer.send('widget-move', b.x + ev.screenX - x0, b.y + ev.screenY - y0);
  const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
});
$('grip').addEventListener('mousedown', async e => {
  e.stopPropagation();
  const b = await ipcRenderer.invoke('widget-bounds'); if (!b) return;
  const x0 = e.screenX, y0 = e.screenY;
  const move = ev => ipcRenderer.send('widget-resize', b.width + ev.screenX - x0, b.height + ev.screenY - y0);
  const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
});
$('close').addEventListener('mousedown', e => e.stopPropagation());
$('close').addEventListener('click', () => ipcRenderer.send('widget-close'));
addEventListener('contextmenu', e => { e.preventDefault(); ipcRenderer.send('widget-menu'); });
$('status').addEventListener('click', () => { if ($('status').classList.contains('done') && lastOut) ipcRenderer.send('widget-show-folder', lastOut); });

// ---------- dropping ----------
const box = $('box');
['dragenter', 'dragover'].forEach(t => addEventListener(t, e => { e.preventDefault(); if (!busy) box.classList.add('over'); }));
addEventListener('dragleave', e => { if (e.target === document.documentElement || !e.relatedTarget) box.classList.remove('over'); });
addEventListener('drop', e => {
  e.preventDefault(); box.classList.remove('over');
  if (busy) return status('Still working on the last files', 'err');
  const files = [...e.dataTransfer.files].map(f => webUtils.getPathForFile(f)).filter(Boolean);
  if (files.length) run(files);
});

const OPENABLE = /\.(pdf|docx?|docm|dotx?|dotm|rtf|odt|wps|wpd|txt|md|csv|tsv|xlsx?|xlsm|xlsb|xltx?|ods|pptx?|pptm|ppsx?|odp|key|pages|numbers|png|jpe?g|jfif|gif|bmp|tiff?|webp|heic|heif|avif|svg|svgz|ico|psd|psb|tga|dds|pcx|icns|jp2|j2k|emf|wmf|ppm|pgm|pbm|xbm|xps|oxps|epub|mobi|fb2|cbz|html?|mht|mhtml|dxf|dwg|eml|msg|xml|json|log|ini)$/i;
let port = 0;
async function api(route, body) {
  const r = await fetch(`http://127.0.0.1:${port}/${route}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
function unique(p) {
  if (!fs.existsSync(p)) return p;
  const ext = path.extname(p), base = p.slice(0, -ext.length);
  for (let i = 2; ; i++) { const q = `${base} (${i})${ext}`; if (!fs.existsSync(q)) return q; }
}
const outDir = src => S.saveTo === 'folder' && S.folder && fs.existsSync(S.folder) ? S.folder : path.dirname(src);

async function run(files) {
  busy = true; box.classList.add('busy');
  const A = S.actions, errors = [], saved = [];
  const skipped = files.filter(f => !OPENABLE.test(f) || !fs.existsSync(f));
  files = files.filter(f => !skipped.includes(f));
  if (skipped.length) errors.push(`${skipped.length} ${skipped.length === 1 ? 'file' : 'files'} it can't open (${path.basename(skipped[0])}${skipped.length > 1 ? '…' : ''})`);
  try {
    if (!files.length) throw new Error(errors[0] || 'Nothing to do');
    status('Starting…'); port = await ipcRenderer.invoke('engine-port');
    // 1. make PDFs of everything (kept only when Convert is on; Merge, Split and Print need PDFs anyway)
    let pdfs = [];
    const needPdf = A.convert || A.merge || A.split || A.print;
    for (let i = 0; i < files.length && needPdf; i++) {
      const f = files[i];
      status(`Converting ${i + 1} of ${files.length}…`);
      if (/\.pdf$/i.test(f)) { pdfs.push({ src: f, pdf: f }); continue; }
      const d = await api('process_file', { filepath: f });
      if (d.error || !d.pdf_path) { errors.push(`${path.basename(f)}: ${d.error || "couldn't convert"}`); continue; }
      let pdf = d.pdf_path;
      if (A.convert) { pdf = unique(path.join(outDir(f), path.basename(f, path.extname(f)) + '.pdf')); fs.copyFileSync(d.pdf_path, pdf); saved.push(pdf); }
      pdfs.push({ src: f, pdf });
    }
    let results = pdfs.map(p => p.pdf);
    // 2. merge or split (never both)
    if (A.merge && pdfs.length > 1) {
      status(`Merging ${pdfs.length} files…`);
      const first = pdfs[0].src, name = path.basename(first, path.extname(first)) + ' (merged).pdf';
      const d = await api('merge_queue', { files: pdfs.map(p => p.pdf), names: pdfs.map(p => path.basename(p.src)), first_original_path: path.join(outDir(first), path.basename(first)), name });
      if (d.error) errors.push('Merging: ' + d.error); else { results = [d.path]; saved.push(d.path); }
    } else if (A.split) {
      const parts = [];
      for (let i = 0; i < pdfs.length; i++) {
        status(`Splitting ${i + 1} of ${pdfs.length}…`);
        const d = await api('split_pdf', { filepath: pdfs[i].pdf, original_path: path.join(outDir(pdfs[i].src), path.basename(pdfs[i].src)), plain_names: true });
        if (d.error) errors.push(`${path.basename(pdfs[i].src)}: ${d.error}`); else { parts.push(...(d.paths || [])); saved.push(...(d.paths || [])); }
      }
      results = parts;
    }
    // 3. print, after 5 seconds to change your mind
    if (A.print && results.length) {
      const printer = S.printer || (await ipcRenderer.invoke('widget-printers')).find(p => p.isDefault)?.name;
      if (!printer) errors.push('Printing: pick a printer (right-click the widget)');
      else if (await countdown(results.length, printer)) {
        for (let i = 0; i < results.length; i++) {
          status(`Printing ${i + 1} of ${results.length} on ${printer.split('\\').pop()}…`);
          const e = await printOne(results[i], printer); if (e) errors.push(`${path.basename(results[i])}: ${e}`);
        }
      } else errors.push('Printing cancelled');
    }
    // 4. open in Toast Docs
    if (A.open) ipcRenderer.send('widget-open', results.length ? results : files);
    lastOut = saved[saved.length - 1] || null;
    const msg = saved.length ? `Done - ${saved.length} ${saved.length === 1 ? 'PDF' : 'PDFs'} saved` : 'Done';
    if (errors.length) status(`${msg}. ${errors[0]}${errors.length > 1 ? ` (+${errors.length - 1} more)` : ''}`, saved.length ? 'done' : 'err');
    else status(msg, saved.length ? 'done' : '');
    $('status').title = errors.join('\n') || (lastOut ? 'Click to open the folder' : '');
  } catch (err) { status(String(err.message || err), 'err'); }
  busy = false; box.classList.remove('busy'); ipcRenderer.send('engine-done');
}

function countdown(n, printer) {
  return new Promise(resolve => {
    let left = 5; const btn = $('cancel'); btn.style.display = 'inline-block';
    const tick = () => status(`Printing ${n} ${n === 1 ? 'file' : 'files'} on ${printer.split('\\').pop()} in ${left}…`);
    tick();
    const t = setInterval(() => { left--; if (left <= 0) { clearInterval(t); btn.style.display = 'none'; resolve(true); } else tick(); }, 1000);
    btn.onclick = () => { clearInterval(t); btn.style.display = 'none'; resolve(false); };
  });
}

// the same printing as the app's print window, with what was remembered for this printer there
async function printOne(file, printer) {
  let by = {}; try { by = JSON.parse(localStorage.getItem('print-by-printer')) || {}; } catch (e) {}
  const mem = by[printer] || {};
  const info = await api('printer_info', { name: printer }).catch(() => null);
  const paper = info && !info.error ? info.paper : [612, 792], printable = info && !info.error ? info.printable : null;
  const label = Math.min(...paper) <= 432 && Math.max(...paper) <= 648;
  const d = await api('print_prepare', { filepath: file, paper, printable, mode: mem.mode || (label ? 'label' : 'page'), orient: 'auto', scale: 'fit',
    skip_blank: mem.skip !== undefined ? mem.skip : label, comments: true, layout: 'single' });
  if (d.error) return d.error;
  const flip = d.turned ? (mem.flipTurned !== undefined ? mem.flipTurned : mem.flip) : mem.flip;
  const fix = d.turned ? (mem.fixTurned !== undefined ? mem.fixTurned : /LP ?320/i.test(printer)) : mem.fix;   // same as the print window
  const r = await api('print_render', { path: d.path, dpi: info && info.dpi ? info.dpi : 300, flip: !!flip !== !!fix });
  if (r.error) return r.error;
  const res = await ipcRenderer.invoke('print-pages', r.pages, { deviceName: printer, copies: Math.max(1, S.copies || 1), color: true, duplex: 'simplex' });
  return res && res.error ? res.error : null;
}
load();
</script>
</body></html>
